name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize dependencies
        run: uv sync --locked --python 3.12

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check --output-format github .

      - name: Type-check
        run: uv run mypy src --python-version 3.12

      - name: Test with coverage gate
        run: >-
          uv run pytest -q
          --cov=visual_verifier
          --cov-report=term-missing
          --cov-report=xml

      - name: Build distributions
        run: uv run python -m build

      - name: Verify the built wheel installs and runs standalone
        run: |
          uv venv .wheel-check --python 3.12
          uv pip install --python .wheel-check dist/*.whl
          .wheel-check/bin/visual-verifier --version
          .wheel-check/bin/visual-verifier doctor

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Synchronize dependencies
        run: >-
          uv sync
          --locked
          --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  windows-regression:
    name: Windows regression
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize dependencies
        run: uv sync --locked --python 3.12

      - name: Run environment check
        run: uv run visual-verifier doctor

      - name: Run regression suite
        run: uv run pytest -q

  macos-regression:
    name: macOS regression
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize dependencies
        run: uv sync --locked --python 3.12

      - name: Run environment check
        run: uv run visual-verifier doctor

      - name: Run regression suite
        run: uv run pytest -q
