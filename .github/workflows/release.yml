name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Synchronize dependencies
        run: uv sync --locked --python 3.12

      - name: Assert the tag, package, and citation versions all agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          uv run python scripts/check_release_version.py
          "${{ github.ref_name }}"

      - name: Run the full quality gate
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src --python-version 3.12
          uv run pytest -q --cov=visual_verifier

      - name: Make README asset links absolute for PyPI
        run: >-
          uv run python scripts/build_pypi_readme.py
          --ref ${{ github.ref_name }}

      - name: Build distributions
        run: uv run python -m build

      - name: Validate PyPI metadata and README rendering
        run: uv run --with twine twine check --strict dist/*

      - name: Confirm the wheel ships typing marker and tracking modules
        run: |
          uv run python - <<'PY'
          import pathlib
          import zipfile

          wheel_path = next(pathlib.Path("dist").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel_path).namelist())
          required = {
              "visual_verifier/py.typed",
              "visual_verifier/tracking/tracker.py",
              "visual_verifier/media/video_writer.py",
              "visual_verifier/reporting/track_report.py",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          forbidden = sorted(
              name for name in names if name.startswith(("tests/", "archive/"))
          )
          if forbidden:
              raise SystemExit(f"wheel contains excluded files: {forbidden}")
          print(f"{wheel_path.name} contents verified")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/visual-verifier
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish with trusted publishing
        # pypa/gh-action-pypi-publish v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
