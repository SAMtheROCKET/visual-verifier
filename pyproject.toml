[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-verifier"
dynamic = ["version"]
description = "Anonymization QA for images and videos. Verify blur, redaction, and masking frame by frame."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Sambit Supriya Dash" },
]
keywords = [
    "anonymization",
    "anonymization-testing",
    "video-anonymization",
    "image-anonymization",
    "privacy-engineering",
    "redaction-testing",
    "computer-vision",
    "image-processing",
    "opencv",
    "privacy",
    "quality-assurance",
    "redaction",
    "testing",
    "video-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/SAMtheROCKET/visual-verifier"
Repository = "https://github.com/SAMtheROCKET/visual-verifier"
Documentation = "https://samtherocket.github.io/visual-verifier/"
Changelog = "https://github.com/SAMtheROCKET/visual-verifier/blob/main/CHANGELOG.md"
Issues = "https://github.com/SAMtheROCKET/visual-verifier/issues"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
visual-verifier = "visual_verifier.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "visual_verifier.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visual_verifier = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "ARG",
    "B",
    "C4",
    "C90",
    "D",
    "E",
    "E501",
    "F",
    "I",
    "N",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "TID",
    "UP",
]
ignore = [
    "D202",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
files = ["src/visual_verifier"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["visual_verifier"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 88
